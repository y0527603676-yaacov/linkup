# LINKUP Shopify app — production configuration, deployed by GitHub Actions (.github/workflows/shopify-app-deploy.yml).
# client_id is filled in at deploy time from the repository variable SHOPIFY_CLIENT_ID (a public identifier, not a secret).
client_id = "REPLACE_WITH_SHOPIFY_CLIENT_ID"
name = "LINKUP"
application_url = "https://linkup-tawny.vercel.app/app/connect"
embedded = false

[access_scopes]
scopes = "read_orders,read_products,write_discounts,write_pixels,read_customer_events"
# LINKUP starts the install from its own site (authorization code grant with a one-time state).
use_legacy_install_flow = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = false

[auth]
redirect_urls = ["https://ycuvcpslvkgndytubycn.supabase.co/functions/v1/apps/shopify/callback"]

[webhooks]
api_version = "2026-07"

  # Mandatory privacy webhooks (LINKUP keeps no customer names or contacts; only an e-mail hash).
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://ycuvcpslvkgndytubycn.supabase.co/functions/v1/apps/shopify/webhook"

  # Order and uninstall webhooks are registered per shop by LINKUP after install (webhookSubscriptionCreate),
  # so they are not repeated here (no double deliveries).

[pos]
embedded = false
