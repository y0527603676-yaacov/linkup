<!doctype html>
<html lang="he" dir="rtl">
<body dir="rtl" style="margin:0;padding:0;background:#f7f7f4;font-family:Arial,Helvetica,sans-serif;color:#24103f;">
  <table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f7f4;padding:24px 12px;">
    <tr><td align="center" dir="rtl">
      <table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;background:#ffffff;border-radius:16px;padding:24px;direction:rtl;text-align:right;">
        <tr><td dir="rtl" align="right" style="padding-bottom:18px;">
          <img src="https://linkup-tawny.vercel.app/brand/linkup-logo.png" width="96" height="24" alt="LINKUP" style="display:block;border:0;font-size:14px;font-weight:bold;color:#3b0a8f;">
        </td></tr>
        <tr><td dir="rtl" align="right" style="font-size:19px;font-weight:bold;padding-bottom:8px;direction:rtl;">כניסה ל-<span dir="ltr">LINKUP</span></td></tr>
        <tr><td dir="rtl" align="right" style="font-size:15px;line-height:1.6;color:#4a4560;padding-bottom:20px;direction:rtl;">לחצו על הכפתור כדי להיכנס. אין צורך בסיסמה.</td></tr>
        <tr><td dir="rtl" align="right" style="padding-bottom:22px;">
          <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;background:#5b3df5;color:#ffffff;text-decoration:none;font-weight:bold;font-size:16px;padding:13px 26px;border-radius:999px;">כניסה</a>
        </td></tr>
        <tr><td dir="rtl" align="right" style="font-size:12px;line-height:1.7;color:#8a86a0;border-top:1px solid #eeeaf5;padding-top:14px;direction:rtl;">
          הקישור תקף לזמן קצר ולשימוש אחד. אם לא ביקשתם להיכנס, אפשר להתעלם מההודעה.<br>
          משתמשים באפליקציה שבמסך הבית של אייפון? קוד חלופי: <span dir="ltr" style="font-weight:bold;color:#4a4560;letter-spacing:2px;">{{ .Token }}</span>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
